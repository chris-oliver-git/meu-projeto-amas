<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Chat de agendamento | Cartão AMAS</title>
  <style>
    body { margin: 0; background: white; color: #16274a; font: 1rem/1.5 system-ui, sans-serif; }
    #status { margin: 2rem; text-align: center; }
  </style>
</head>
<body>
  <p id="status" role="status">Abrindo o chat de agendamento…</p>
  <noscript>Ative o JavaScript para acessar o chat.</noscript>
  <script>
    function mostrarFalha() {
      const status = document.getElementById('status');
      const link = document.createElement('a');
      link.href = './';
      link.textContent = 'Tentar novamente';
      status.replaceChildren('Não foi possível abrir o chat. ', link);
    }
  </script>
  <script src="https://ezchatbot.ai/webchat/index.umd.js"
    class="EzWebchat"
    id="9d8959f6-bb63-4d0c-89f8-dc6432cd5d51.a164e4c6-f59a-4c79-a388-df988c4175e2"
    data-fullscreen="true"
    onerror="mostrarFalha()"></script>
  <script>
    if (window.ezchat) {
      const status = document.getElementById('status');
      const deadline = Date.now() + 30000;
      const timer = setInterval(() => {
        if (window.ezchat.lastError) {
          mostrarFalha();
        } else if (document.querySelector('[data-fullscreen][data-open]')) {
          status.hidden = true;
        } else if (Date.now() >= deadline) {
          mostrarFalha();
        } else {
          return;
        }
        clearInterval(timer);
      }, 250);
    }
  </script>
</body>
</html>
